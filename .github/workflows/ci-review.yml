name: CI + AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  # ========== 1. 代码风格检查 ==========
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install ruff
      - name: Ruff 代码检查
        run: ruff check src/ tests/

  # ========== 2. 类型检查 ==========
  type-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install mypy
          pip install -r requirements.txt
      - name: Mypy 类型检查
        run: mypy src/ --ignore-missing-imports

  # ========== 3. 单元测试 ==========
  test:
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: 运行测试
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  # ========== 4. AI 代码审查 ==========
  ai-review:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI 代码审查
        run: |
          git fetch origin ${{ github.base_ref }}

          # 获取 PR diff，限制长度避免超 token
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- . \
            | head -c 15000)

          if [ -z "$DIFF" ]; then
            echo "没有代码变更"
            exit 0
          fi

          # 调用 DeepSeek API 审查
          REVIEW=$(curl -s https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg diff "$DIFF" '{
              model: "deepseek-chat",
              messages: [
                {
                  role: "system",
                  content: "你是资深代码审查专家。审查以下 git diff，关注：\n1. 安全漏洞（SQL注入、XSS、密钥泄露等）\n2. 逻辑错误和边界情况\n3. 性能问题\n4. 代码风格和可维护性\n\n用中文回复，使用以下格式：\n\n## 👀 代码审查报告\n\n### ❌ 严重问题\n- **文件**: `path/to/file.py`\n- **问题**: ...\n- **建议**: ...\n\n### ⚠️ 改进建议\n- **文件**: `path/to/file.py`\n- **建议**: ...\n\n### ✅ 做得好的地方\n- ...\n\n如果没有发现问题，回复：## ✅ 审查通过\n代码质量良好，未发现明显问题。"
                },
                {
                  role: "user",
                  content: $diff
                }
              ]
            }')" | jq -r '.choices[0].message.content // "API 调用失败"')

          # 发布 PR 评论
          echo "$REVIEW" | gh pr comment ${{ github.event.pull_request.number }} \
            --body-file -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ========== 5. 自动合并 ==========
  auto-merge:
    needs: ai-review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 启用自动合并
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash --auto --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
